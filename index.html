<!DOCTYPE html>
<html lang="en">
<head>
<!--
 =====================================================================
  SpeakUp English - single file app (HTML + CSS + JavaScript)
 =====================================================================
  HOW THE FILE IS ORGANISED (search for these titles with Ctrl+F)
    1. STYLE block ... all CSS. Colours are CSS variables in :root
                      (light theme) and :root[data-theme="dark"].
    2. BODY .......... only empty containers (#v = page, #nv = bottom bar,
                      #ls = lesson screen, #pk/#mn/#sx = pop ups).
                      JavaScript fills them with HTML strings.
    3. SCRIPT block .. DATA first (units, words, sentences), then STATE,
                      then SCREENS (Home, Today, Vocabulary, Menu, Speak, Me),
                      then LESSON ENGINE (exercise builders, lesson screen,
                      checking answers, speaking, podcast / Lucy scene),
                      then the global CLICK handler and start-up code.
 
  LEVEL LABELS (CEFR) - these are notes for the developer only, they are
  not shown in the app:
    LEVEL FILTER ................... Basic / Intermediate / Advanced buttons on Home.
                                     Each unit has lv:"basic"|"inter"|"adv" (no lv = "inter").
                                     See the "LEVEL FILTER" part of the SCRIPT (lvOf, lvBar).
    Work BASIC (5 new units) ....... A1-A2 (see "Work section: BASIC level")
    Work INTERMEDIATE (5 new units)  B1-B2 (see "Work section: INTERMEDIATE level")
    Work (5 old base units) ........ B2-C1 = tagged Advanced (see "Work section")
    Work field lessons (office, IT)  B1-B2  = Intermediate
    Advanced English section ....... B1+ to C1 (unit names start with B1+, B2, C1)
    Study (5 base units + 5 fields) . B1-B2  = Intermediate (see "Study section")
    Teaching / Interview / Everyday / Technology
                                     no level is set in the code
    IELTS preparation .............. no level is set in the code (exam prep)
 
  WHERE PROGRESS IS SAVED: localStorage key "su2" (object S) and "su2nav"
  (last opened tab). Use Me > Backup to export / import it.
 =====================================================================
-->

#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}

button{font:inherit;border:0;cursor:pointer;min-height:48px;min-width:48px;border-radius:14px;padding:0 18px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 6px 16px rgba(108,92,231,.35);transition:transform .15s,filter .2s}

ebook.",["write","writes","writing"],0],["Both sides of an equation must be ___.",["balance","balancing","balanced"],2]],"ch":["Can you solve this equation for me?","Yes, I can, I just subtract three from both sides.","Yes, I can, but first the equation must eat lunch."]},{"id":"teaching/math/geometry-and-shapes","t":"Geometry and shapes","e":"📐","s":["Today we are going to study shapes.","Please take out your rulers and pencils.","This shape has three sides, so it is a triangle.","Can you name a shape with four equal sides?","An angle of ninety degrees is called a right angle.","Use the protractor to measure this angle carefully.","The perimeter is the distance around the outside of the shape.","How do we find the area of a rectangle?","Multiply the length by the width to get the area.","Draw a straight line, then mark the centre of your circle.","The radius is half the diameter, can you see why?","The three angles inside a triangle always add up to one hundred eighty degrees.","What is the perimeter of a square with sides of five centimetres?","Measure twice and draw once, so your diagram is neat."],"w":[["Triangle","A shape with three straight sides"],["Perimeter","The total distance around a shape"],["Radius","The distance from the centre of a circle to its edge"],["Angle","The space between two lines that meet"],["Area","The amount of surface inside a shape"]],"q":[["A triangle has three ___.",["side","sided","sides"],2],["Please ___ the line with your ruler.",["measure","measuring","measures"],0],["The distance around a circle is called the ___.",["radius","circumference","diagonal"],1]],"ch":["How do I find the area of this rectangle?","Just multiply the length by the width, and write the answer in square centimetres.","Just multiply the length by the width, and then feed the answer to a hungry triangle."]},{"id":"teaching/math/solving-word-problems","t":"Solving word problems","e":"📝","s":["Let's read this problem together, slowly and carefully.","Read it once more, then underline the important numbers.","What is the question asking us to find?","Sara has eight apples and gives away three.","Do we need to add or subtract here?","The words in total tell us to add.","The words how many are left usually mean subtract.","Which operation should we choose, and why?","Please show all your work, not only the final answer.","Write the sum first, then solve it step by step.","Don't forget to write the units, like metres or kilograms or pounds.","Does your answer make sense for this story?","Check your work by doing the calculation a different way.","If a bus holds forty students, how many buses carry one hundred twenty?"],"w":[["Operation","A maths action like adding or dividing"],["Problem","A question that needs to be solved"],["Total","The whole amount after adding everything"],["Estimate","To guess a number that is close"],["Unit","A standard measure such as metres or grams"]],"q":[["First, ___ the problem carefully.",["reads","reading","read"],2],["Which operation ___ we use for this problem?",["do","does","is"],0],["The total is bigger ___ each number we added.",["then","than","that"],1]],"ch":["Can you explain how you solved this problem?","Yes, first I read the question twice, then I chose to subtract.","Yes, first I read the question twice, then it asked me for lunch."]}]},{"id":"sci","n":"Science","e":"🔬","units":[{"id":"teaching/sci/experiments-and-safety","t":"Experiments and safety","e":"🧪","s":["Please put on your safety goggles before we start.","Tie back your long hair and tuck in your sleeves.","Never taste or smell anything in the laboratory.","Who can name the equipment on this table?","Hold the test tube carefully with the tongs.","First, pour fifty millilitres of water into the beaker.","What do you think will happen when we heat it?","Write your hypothesis in your notebook before you begin.","Watch closely and record every change you observe.","If anything spills, tell me immediately and do not touch it."," thesis and give a reason for it.","The thing we change is called the independent variable.","Which variable will you measure in this investigation?","To make it a fair test, we change only one thing.","Everything else must stay the same.","How many times should we repeat the experiment?","Record your data in a table and keep it tidy.","Let's draw a graph to show our results clearly.","What pattern can you see in the data?","Does the evidence support your hypothesis, or was it wrong?","Write a conclusion that answers your original question."],"w":[["Variable","A factor that can change in an experiment"],["Data","Facts and numbers collected during an investigation"],["Conclusion","A final decision based on what you found"],["Results","What you find at the end of a test"],["Evidence","Facts that show something is true"]],"q":[["In a fair test, we change only one ___.",["variable","variables","variably"],0],["Our results ___ that the plant grew faster in sunlight.",["shows","show","showing"],1],["Please write a ___ that answers the question.",["conclude","concluding","conclusion"],2]],"ch":["Was your hypothesis correct?","Not quite, but the results taught us something useful.","Not quite, but the plant told me it prefers jazz."]}]},{"id":"cs","n":"Computer science","e":"🖥️","units":[{"id":"teaching/cs/parts-of-a-computer","t":"Parts of a computer","e":"💻","s":["Please switch on your computer.","Press the power button and wait.","Where is the keyboard on your desk?","Hold the mouse gently and move it slowly.","Can you see the cursor on the screen?","The screen shows everything the computer is doing.","Which port do I use for the headphones?","Plug the cable into the port at the back.","Memory helps the computer work quickly.","Storage keeps your files even when the computer is off.","Does anyone know the difference between memory and storage?","Please do not unplug anything without asking me first.","If the computer freezes, raise your hand and I will help.","Before you it had an error, so I fed it lunch."]},{"id":"teaching/cs/internet-safety","t":"Internet safety","e":"🔒","s":["Always keep your password secret from other people.","Never tell anyone your password, even a friend.","A good password is long and hard to guess.","What should you do if a stranger messages you?","Do not talk to strangers online.","Never share your address or phone number on the internet.","Is it safe to post that photo?","Think carefully before you share anything online.","If something feels wrong, tell a teacher or a parent.","Please report any unkind message to me straight away.","Can you tell which link looks suspicious?","Look at the website address before you click.","Do not click on pop up windows that offer free prizes.","Who can tell me one rule for staying safe online?"],"w":[["Password","A secret word that protects your account"],["Privacy","The right to keep personal information secret"],["Stranger","Someone you do not know"],["Report","To tell an adult about a problem"],["Suspicious","Seeming dangerous or not honest"]],"q":[["Never ___ your password with anyone.",["share","sharing","shared"],0],["If a stranger ___ you, tell an adult.",["message","messages","messaging"],1],["Please think ___ you click on a strange link.",["because","or","before"],2]],"ch":["Did anyone ask for your password online?","No, nobody asked, and I would never tell them.","No, nobody asked, and I told it to my goldfish."]},{"id":"teaching/cs/digital-projects","t":"Digital projects","e":"📊","s":["Open a new slide to begin your project.","Type your title at the top of the page.","Add one picture and a few short words.","Which slide do you want to change?","Please save your file before you close it.","Give your file a clear name so we can find it.","Where did you save your document?","Share the document with your group online.","Each person writes one part, then we join them together.","Can everyone in the team see the same page?","Please don't delete another person's work neral)","e":"🤝","units":[{"id":"interview/gen/behavioral-questions","t":"Behavioral questions","e":"💬","s":["Tell me about a time you solved a problem.","Can you give me an example, please?","In my last job, I led a small team.","What was the situation, and what was your role?","I had to finish the project in two weeks.","First, I made a clear plan with my team.","How did you handle a disagreement with a coworker?","I listened carefully, and then we found a solution together.","What was the result of your actions?","We finished early, and the customer was very happy.","Tell me about a time you made a mistake.","I learned to ask questions earlier, and it helped me a lot.","Can you describe a time you worked under pressure?","That is a good example, thank you for sharing it."],"w":[["Example","A real case that shows what you mean"],["Situation","The conditions or events at a particular time"],["Result","What happens in the end because of an action"],["Challenge","Something difficult that tests your ability"],["Mistake","Something you do wrong by accident"]],"q":[["Tell me about a time ___ you solved a problem.",["what","who","when"],2],["Tell me about a time when you ___ a difficult customer.",["handle","handled","handling"],1],["We worked hard, and the ___ was a big success.",["result","resulting","resultly"],0]],"ch":["Tell me about a time you worked in a team.","Last year, I worked with five people on a big project.","Last year, I worked with five penguins on a big project."]},{"id":"interview/gen/handling-tough-questions","t":"Handling tough questions","e":"🧘","s":["Why was there a gap in your CV?","I took a year off to care for my family.","During that time, I also finished an online course.","Why did you leave your last job?","I wanted new challenges and more responsibility.","What is your biggest weakness?","I sometimes take on too much, but I'm learning to plan better.","Tell me about a failure and what you learned.","Can I take a moment to think about that?", rn fast.","Could you tell me which database your team uses?","An API lets two different programs talk to each other.","I'm honest about what I don't know, and I look it up.","Can I explain how I would test this code?","I usually write unit tests before I send my code for review.","How does your team handle bugs found in production?","I'm still learning Docker, but I have built a few simple containers."],"w":[["Database","An organised collection of data stored on a computer"],["Debug","To find and fix mistakes in code"],["Framework","A ready to use structure that helps developers build software"],["Query","A request to get information from a database"],["Server","A computer that sends data to other computers"]],"q":[["I ___ Python for three years now.",["have used","use","will use"],0],["Sorry, I haven't ___ that tool before.",["use","used","using"],1],["Before I send my code, I always ___ it carefully.",["tests","testing","test"],2]],"ch":["Do you have experience with databases?","Yes, I have used SQL for three years at my last job.","Yes, I have used SQL for teaching my cat to dance."]},{"id":"interview/it/explaining-your-projects","t":"Explaining your projects","e":"🚀","s":["Let me tell you about a project I built.","I built an online shop for a small business.","My role was to write the backend code.","Who else is on the team I would join?","We used React for the website and Node for the server.","What kind of projects will I work on here?","The biggest challenge was making the page load faster.","I solved it by reducing the size of our images.","As a result, the page loaded twice as fast.","Our customers were happy, and sales went up.","Would you like me to explain the technical details?","I led a small team of three developers for six months.","If I could do it again, I would plan more carefully.","Do you want to see the code on my laptop?"],"w":[["Feature","A useful part or function of a software product"],["Launch","To release a product to users for the first time"],["Challenge","Something difficult that tests your skills"],["Backend","The hidden part of software that handles data and logic"],["Result","What happens because of something you did"]],"q":[["I ___ the login feature last year.",["build","built","building"],1],["The project was difficult, ___ we finished on time.",["but","because","or"],0],["My team and I are proud ___ the result.",["for","at","of"],2]],"ch":["What was your role in that project?","I was the lead developer, and I managed the database.","I was the lead developer, and I fed the keyboard every morning."]},{"id":"interview/it/thinking-aloud","t":"Thinking aloud","e":"🧠","s":["Let me think about this for a moment.","First, I would read the problem carefully.","Can I ask a few questions before I start?","Do you want the fastest solution or the simplest one?","I will assume the list is not empty.","Is it okay if I assume the input is always numbers?","The simple way is to check every item one by one.","That works, but it could be slow with big data.","A faster option uses more memory, so there is a trade off.","I would choose speed here because users hate waiting.","Now I will write the code step by step.","Let me test it with a small example first.","What should happen if the input is empty?","I think it works, but let me check one more edge case."],"w":[["Assume","To accept something as true without proof"],["Algorithm","A set of steps for solving a problem"],["Input","Data that you give to a program"],["Efficient","Working well without wasting time or resources"],["Optimize","To make something work as well as possible"]],"q":[["If the list is empty, the function ___ nothing.",["return","returns","returning"],1],["I would test the code ___ I submit it.",["since","during","before"],2],["This solution is faster ___ the first one.",["than","then","that"],0]],"ch":["Can you walk me through your thinking?","Sure, first I would check the input for errors.","Sure, first I would ask my coffee cup for advice."]},{"id":"interview/it/teamwork-in-tech","t":"Teamwork in tech","e":"🤝","s":["I enjoy working in a team.","We use agile, with short sprints of two weeks.","Every morning we have a quick meeting about our progress.","How does your team do code review?","I welcome feedback because it helps me improve.","Once I disagreed with a teammate about the design.","We talked calmly, listened to each other, and found a compromise.","When a deadline is close, I tell my manager early.","If I'm stuck, I ask a colleague for help.","How do you support developers who want to learn new tools?","I learned a new framework in two weeks for a client.","Do developers here work together or mostly on their own?","I always leave polite comments when I review someone else's code.","What does a normal sprint look like for this team?"],"w":[["Agile","A flexible way of working in small steps"],["Sprint","A short period for finishing planned work"],["Review","To check someone's work and suggest improvements"],["Feedback","Comments about your work that help you improve"],["Compromise","An agreement where both sides give up something"]],"q":[["My teammate and I ___ about the design yesterday.",["talk","talked","talking"],1],["I always ask for help ___ I am stuck.",["but","so","when"],2],["Our team meets every day ___ the morning.",["in","on","at"],0]],"ch":["How do you handle disagreements at work?","I stay calm and listen to their point of view.","I stay calm and listen to the wall for an hour."]}]},{"id":"teach","n":"Teaching","e":"👩‍🏫","units":[{"id":"interview/teach/teaching-philosophy","t":"Teaching philosophy","e":"💭","s":["I believe every student can learn with the right support.","Why did you choose to become a teacher?","I love seeing students feel proud of their progress.","I want learning to be fun and meaningful.","How do you motivate students who seem bored?","I give small rewards and praise to keep them motivated.","In my classroom, everyone's voice matters and every question is welcome.","What does an inclusive classroom mean to you?","I adapt my lessons so every learner can join in.","Students learn best when they are active, not just listening.","I use music, games, and drawing to encourage creativity.","Where do you see yourself as a teacher in five years?","I hope to help students become confident, independent thinkers.","Could you tell us how you build trust with shy students?"],"w":[["Inclusive","Welcoming and fair to every kind of person"],["Motivate","To give someone a reason to try hard"],["Curriculum","The subjects and topics a school teaches"],["Creativity","The ability to think of new ideas"],["Encourage","To give someone confidence and support to continue"]],"q":[["I try to ___ my students to ask questions.",["encourage","prevent","forget"],0],["She ___ teaching for ten years, so she has a lot of experience.",["is be","has been","have being"],1],["Our school wants an ___ classroom where everyone belongs.",["tired","distant","inclusive"],2]],"ch":["Why do you want to teach at our school?","I want to teach here because I love working with young learners.","I want to teach here because I love working with young dragons and pizza."]},{"id":"interview/teach/classroom-management-questions","t":"Classroom management questions","e":"🔔","s":["How do you deal with a student who talks during lessons?","I stay calm and speak to the student quietly.","On the first day, I explain the class rules clearly.","I always involve students when we create the rules.","What do you do when two students start arguing?","I separate them first and listen to both sides.","Routines help students know what to expect every day.","I greet everyone at the door and start with a short warm up.","How do you make sure you treat every student fairly?","I use the same rules for everyone, and I explain my decisions.","Once, a boy refused to work, so I asked him privately what was wrong.","He felt embarrassed about reading, so I gave him easier tasks.","Would you ever call a parent about bad behaviour?","I would contact the family early, before the problem grows."],"w":[["Disruption","Something that stops a lesson from continuing normally"],["Routine","A fixed way of doing things every day"],["Discipline","Training that teaches people to follow rules"],["Fairness","Treating everyone equally and without favourites"],["Behaviour","The way a person acts"]],"q":[["If a student ___ the lesson, I speak to him quietly.",["interrupting","interrupt","interrupts"],2],["We need clear rules so students know what is ___ of them.",["expected","expecting","expect"],0],["I always treat all students ___.",["fair","fairly","fairness"],1]],"ch":["How would you handle a noisy class?","I would stay calm and wait until they are quiet.","I would stay calm and wait until the desks start singing."]},{"id":"interview/teach/demo-lesson","t":"Demo lesson","e":"📝","s":["Thank you for letting me teach a short lesson today.","Today's lesson is about describing our daily routines.","By the end, students will be able to ask and answer simple questions.","First, I will show a picture to get everyone interested.","Can anyone tell me what they see?","Now, please work with a partner and practise the dialogue.","I have prepared flashcards, a worksheet, and a short video.","Are you ready to try the next activity?","I walk around the room to listen and help.","To check understanding, I ask a few quick questions.","Who can explain the rule in their own words?","The main activity takes about ten minutes.","If we have extra time, we will play a quick game.","What did you learn today, and what was difficult?"],"w":[["Objective","The goal a lesson wants students to reach"],["Activity","A task students do to practise something"],["Worksheet","A paper with exercises for students to complete"],["Flashcard","A small card with a word or picture"],["Summary","A short review of the main points"]],"q":[["The ___ of this lesson is to practise past tense verbs.",["lunch","objective","weather"],1],["Please work ___ a partner and practise the dialogue.",["with","at","of"],0],["I will ask questions to check whether students ___ the lesson.",["understanding","understands","understand"],2]],"ch":["How long will your lesson take?","It will take about twenty minutes in total.","It will take about twenty minutes, or one hundred sleepy elephants."]},{"id":"interview/teach/working-with-parents-and-staff","t":"Working with parents and staff","e":"🤝","s":["How do you keep in touch with parents?","I send a short email every week with news.","I always start parent meetings with something positive.","If a child struggles, I call the parents early.","What would you do if a parent disagreed with you?","I would listen carefully and try to find a solution.","I enjoy working with colleagues and sharing ideas.","Could you describe a time you worked in a team?","I helped plan the school science fair with three other teachers.","I would love to help with school events and trips.","How do you react when someone gives you feedback?","I welcome feedback because it helps me improve.","I want to attend workshops and keep developing as a teacher.","Does your school offer training for new teachers?"],"w":[["Communicate","To share information with other people clearly"],["Colleague","A person you work with"],["Feedback","Comments that tell you how well you did"],["Workshop","A short training session where people learn skills"],["Conference","A meeting where parents and teachers discuss a student"]],"q":[["I try to ___ clearly with every parent.",["communication","communicating","communicate"],2],["My ___ are friendly and always help new teachers.",["colleagues","shoes","clouds"],0],["Thank you for your ___ about my lesson.",["feedbacks","feedback","feedbacking"],1]],"ch":["Do you have any questions for us?","Yes, how many students are in each class?","Yes, how many penguins are in each class?"]}]},{"id":"cs","n":"Customer service","e":"🎧","units":[{"id":"interview/cs/why-customer-service","t":"Why customer service","e":"💬","s":["I enjoy helping people solve their problems.","I am a friendly person and I like talking to people.","I want this job because I love helping others.","I have one year of experience in a busy shop.","I am patient, and I listen carefully to every customer.","Good communication means speaking clearly and being polite.","What does a normal day look like in this role?","I worked at a call center for two years.","I stay calm when the phone is ringing all the time.","Is there training for new members of the team?","I believe a happy customer will come back again.","How many customers does the team help each day?","I'm good at explaining things in a simple way.","Could you tell me what makes a great agent here?"],"w":[["Patience","Staying calm when things take a long time"],["Polite","Showing good manners and respect to others"],["Experience","Knowledge you get from doing a job"],["Communication","Sharing information by speaking or writing"],["Helpful","Willing to give support to others"]],"q":[["I like ___ people with their questions.",["help","helping","to helping"],1],["I have worked in customer service ___ two years.",["since","during","for"],2],["I am very patient, so I ___ stay calm.",["can","am","does"],0]],"ch":["Why do you want to work in customer service?","I enjoy talking to people and solving their problems.","I enjoy talking to people and teaching them to juggle."]},{"id":"interview/cs/difficult-customers","t":"Difficult customers","e":"😤","s":["Once, a customer shouted at me about a late order.","I stayed calm and let him finish speaking.","I told him I was sorry about the delay.","Then I asked questions to understand the real problem.","I checked his order and found the mistake.","How would you like me to handle angry callers?","I offered him a refund and a small discount.","Would you like to hear how the story ended?","I never take angry words personally.","When I can't fix a problem, I ask my manager for help.","Do I need to escalate serious complaints to a supervisor?","After that call, I wrote notes so we could avoid the same mistake.","What is the hardest type of complaint here?","I learned that listening is the fastest way to calm someone down."],"w":[["Complaint","A statement that you are unhappy about something"],["Escalate","To pass a problem to a more senior person"],["Refund","Money that is given back to a customer"],["Apologise","To say sorry for a mistake"],["Calm","Quiet and relaxed, not angry or upset"]],"q":[["The customer was angry, so I ___ calm.",["stay","stayed","staying"],1],["I understand why you ___ upset.",["is","be","are"],2],["I will ask my manager if I can't ___ the problem.",["solve","solved","solving"],0]],"ch":["What would you do if a customer shouted at you?","I would stay calm and listen to the problem.","I would stay calm and sing him a lullaby."]},{"id":"interview/cs/role-play-questions","t":"Role play questions","e":"🎭","s":["Hello, thank you for calling, how can I help?","I'm so sorry to hear that.","Let me check your account right now.","Could you give me your order number, please?","Thank you for waiting, I really appreciate your patience.","I completely understand why you feel upset.","I apologise for the mistake, and I will fix it today.","Would you like a replacement or your money back?","I can send a new one tomorrow, free of charge.","Is there anything else I can help you with?","I'm afraid I can't do that, but here is what I can do.","Let me speak to my supervisor, and I will call you back.","You will get an email with all the details in ten minutes.","Thank you for your feedback, and have a lovely day."],"w":[["Replacement","A new item given instead of a broken one"],["Account","Your personal record with a company or service"],["Appreciate","To be thankful for something"],["Upset","Unhappy or worried about something"],["Solution","An answer that solves a problem"]],"q":[["Let me ___ that for you right away.",["fixes","fixing","fix"],2],["I would be happy ___ you with that.",["help","to help","helping"],1],["Thank you ___ calling our support line.",["for","to","at"],0]],"ch":["Hello, my parcel hasn't arrived yet.","I'm sorry about that, let me check your order.","I'm sorry about that, I will send my goldfish to look."]},{"id":"interview/cs/shifts-and-availability","t":"Shifts and availability","e":"🕒","s":["I'm available to work full time.","I can work mornings, evenings, and weekends.","What are the working hours for this job?","I don't mind working on public holidays.","I can start in two weeks, after my notice period.","Will the shifts change every week?","I'm happy to work some night shifts.","Do you pay extra for weekends and holidays?","How many calls should I answer each hour?","I always try to meet my targets and help the team.","Is training paid, and how long does it last?","I have my own transport, so I can arrive on time.","Could I swap a shift if something urgent happens?","I would be very happy to start on Monday."],"w":[["Shift","A set period of time that you work"],["Target","A goal or number you try to reach"],["Availability","The times when you are free to work"],["Notice","Warning that you will leave your job soon"],["Overtime","Extra hours that you work after normal time"]],"q":[["I am able to ___ on Saturdays and Sundays.",["work","works","working"],0],["I'm available ___ Monday to Friday.",["at","on","from"],2],["I ___ start next week if you need me.",["did","can","am"],1]],"ch":["Can you work on weekends?","Yes, I can work on Saturdays and Sundays.","Yes, I can work on the moon with my toaster."]}]},{"id":"hc","n":"Healthcare","e":"🏥","units":[{"id":"interview/hc/patient-care-questions","t":"Patient care questions","e":"🩺","s":["I became a nurse because I enjoy helping people.","How do you make nervous patients feel comfortable?","I smile, introduce myself, and explain what I am doing.","I always listen carefully before I answer.","What does good patient care mean to you?","To me, it means treating everyone with kindness and respect.","When patients are in pain, I check on them often.","How do you speak to a patient who is scared?","I use simple words and speak slowly and gently.","Last week, an elderly man was lonely, so I sat and talked with him.","Please tell me if you feel any discomfort.","Can you describe a time you comforted a worried family?","I told the family what to expect and answered every question.","I always make sure patients have water, blankets, and privacy."],"w":[["Empathy","The ability to understand how another person feels"],["Comfort","A feeling of being relaxed and free from pain"],["Symptom","A sign of illness that a patient feels"],["Gentle","Soft, kind, and careful, not rough"],["Reassure","To say things that make someone less worried"]],"q":[["I always ___ patients what I am going to do.",["say","tell","speak"],1],["She showed great ___ when the patient started to cry.",["hunger","speed","empathy"],2],["How long have you ___ these symptoms?",["had","have","having"],0]],"ch":["I'm very nervous about my operation tomorrow.","Don't worry, I will stay with you and explain every step.","Don't worry, I will stay with you and juggle the bananas."]},{"id":"interview/hc/working-under-pressure","t":"Working under pressure","e":"🚑","s":["Our ward is often very busy, and I like that.","How do you handle a busy shift?","I make a list and start with the most urgent tasks.","What do you do when several patients need help at once?","I check who is in danger first.","In an emergency, I stay calm and follow the protocol.","I take a deep breath and think before I act.","Have you ever worked a night shift?","Yes, I worked nights for two years and learned to manage tiredness.","I drink water, eat well, and take short breaks when I can.","Could you give an example of a stressful day?","Once, three patients arrived together, so I called for extra help.","I am not afraid to ask my team for support.","How do you relax after a hard day at work?"],"w":[["Emergency","A sudden dangerous situation that needs quick action"],["Priority","Something that is more important than other things"],["Urgent","Needing attention right now"],["Stress","A feeling of worry caused by pressure"],["Shift","A set period of time that you work"]],"q":[["In an emergency, the ___ is to stay calm.",["dessert","holiday","priority"],2],["I have ___ on night shifts for three years.",["work","worked","working"],1],["The patient needs help ___, so I run to the room.",["immediately","immediate","immediacy"],0]],"ch":["How do you stay calm when it gets very busy?","I take a deep breath and focus on one task at a time.","I take a deep breath and ask the ceiling for advice."]},{"id":"interview/hc/ethics-and-confidentiality","t":"Ethics and confidentiality","e":"🔒","s":["Patient privacy is very important to me.","I never share patient information with people who do not need it.","How do you protect confidential information?","I keep records locked and log out of the computer.","Why is informed consent important?","Patients must understand a treatment before they agree to it.","I always ask permission before I touch a patient.","What would you do if a friend asked about a patient?","I would politely say that I cannot discuss it.","Honesty matters, even when I make a mistake.","If I made an error, I would tell my supervisor immediately.","Have you ever seen a colleague break a rule?","I would follow the hospital policy and report it properly.","Can you explain how you would report a safety concern?"],"w":[["Confidential","Secret and only shared with certain people"],["Consent","Permission to do something, given freely"],["Privacy","The right to keep personal things secret"],["Policy","An official rule or plan a hospital follows"],["Mistake","Something you do wrong by accident"]],"q":[["Patient records are ___ and must stay private.",["colourful","confidential","cheerful"],1],["I must get the patient's ___ before the procedure.",["lunch","mood","consent"],2],["If you make a mistake, you ___ report it quickly.",["should","should to","shoulds"],0]],"ch":["Your neighbour is in hospital. Can you tell me how he is?","I'm sorry, but I cannot discuss any patient, even with friends.","I'm sorry, but I cannot discuss any patient, only my pet frog."]},{"id":"interview/hc/teamwork-in-hospitals","t":"Teamwork in hospitals","e":"🏥","s":["I enjoy working closely with doctors and other nurses.","How do you work with a large team?","I communicate clearly and always say thank you.","What is important during shift handover?","I give a clear report about each patient's condition.","I write notes so the next nurse knows everything.","If I do not understand an order, I ask the doctor.","How do you deal with a conflict at work?","I stay respectful and talk to the person privately.","I am happy to work nights, weekends, and holidays.","Can you tell us about a time you helped a colleague?","I covered part of a shift when a nurse felt sick.","Senior nurses have taught me a lot, and I enjoy learning.","Would you like to ask us anything about the team?"],"w":[["Handover","Passing patient information to the next shift"],["Conflict","A serious disagreement between people"],["Teamwork","People working well together to reach a goal"],["Supervisor","A person who manages and checks other workers"],["Cooperate","To work together with others"]],"q":[["At the end of my shift, I give a ___ to the next nurse.",["holiday","handover","hairdryer"],1],["We always ___ with the doctors.",["cooperating","cooperates","cooperate"],2],["I'd like to ___ from experienced colleagues.",["learn","teach","sleep"],0]],"ch":["How do you handle disagreements with a colleague?","I stay calm and talk to them privately.","I stay calm and challenge them to a dance contest."]}]}]};

(function(){
  function rn(){return Math.random()-.5}
  function sh(a){return a.slice().sort(rn)}
  function parse(k){return(BANK[k]||"").split(";").filter(Boolean).map(function(x){return x.split("|")})}
  function wc(x){return x.split(/\s+/).length}
  // lift(u): keeps only the longer sentences (8+ words) and the longer words (7+ letters) of a unit.
  function lift(u){
    var keep=u.s.filter(function(x){return wc(x)>=8});
    if(keep.length<12){var rest=u.s.filter(function(x){return keep.indexOf(x)<0}).sort(function(a,b){return wc(b)-wc(a)});keep=u.s.filter(function(x){return keep.indexOf(x)>-1||rest.slice(0,12-keep.length).indexOf(x)>-1})}
    u.s=keep;
    var kw=u.w.filter(function(w){return w[0].length>=7});
    if(kw.length<4)kw=u.w.slice().sort(function(a,b){return b[0].length-a[0].length}).slice(0,4);
    u.w=kw;
  }
  // up(): upgrades one unit - lifts it, adds up to 5 new words from BANK, their example sentences and 2 new quiz questions.
  function up(u,idx,key){
    if(u.up||u.sec==="adv")return;
    lift(u);
    var have={};u.w.forEach(function(w){have[w[0].toLowerCase()]=1});
    var parts=key.split("/"),pool=parse(key);
    if(parts.length>1)pool=pool.concat(parse(parts[0]));
    var n=pool.length,added=[],i=0;
    while(added.length<5&&i<n){
      var e=pool[(idx*2+i)%n];i++;
      if(have[e[0].toLowerCase()])continue;
      have[e[0].toLowerCase()]=1;added.push(e);u.w.push(e);
    }
    added.forEach(function(e){if(u.s.indexOf(e[2])<0)u.s.push(e[2])});
    u.s.push("Can you tell me what "+(added[0]?added[0][0].toLowerCase():"this word")+" means?");
    var ws=u.w.map(function(w){return w[0]});
    function opts(c){var o=[c];sh(ws).forEach(function(x){if(o.length<3&&x!==c)o.push(x)});o=sh(o);return o}
    added.slice(0,2).forEach(function(e){
      var o1=opts(e[0]);u.q.push(['Which word means "'+e[1].toLowerCase()+'"?',o1,o1.indexOf(e[0])]);
    });
  }
  var counter={};
  // go(): works out the BANK key for a unit (section, or section/field) and calls up().
  function go(u){var parts=u.id.split("/"),key=parts.length>2?parts[0]+"/"+parts[1]:parts[0];counter[key]=(counter[key]||0)+1;up(u,counter[key],key)}
  BASE.forEach(go);
  for(var k in FIELDS)FIELDS[k].forEach(function(g){g.units.forEach(go)});
  // mkEs(): builds u.es = original sentences that do NOT contain this unit's words (so the first exercise does not give answers away).
  function mkEs(u){
    if(!u.es0)return;
    var st=u.w.map(function(w){return w[0].toLowerCase().slice(0,5)});
    var e=u.es0.filter(function(x){var l=x.toLowerCase();return!st.some(function(k){return l.indexOf(k)>-1})});
    u.es=e.length>=6?e:u.es0;
    u.shE=u.es.filter(function(x){return x.split(/\s+/).length<=6});
  }
  // mkSh(): builds u.sh = short sentences for the listening / speaking exercises.
  function mkSh(u){mkEs(u);
    var sh=(u.sh0||[]).concat(u.s.filter(function(x){return x.split(/\s+/).length<=6})),o=[];
    sh.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});
    u.w.forEach(function(w){var x=w[0].toLowerCase();if(o.length<8)o.push("What does "+x+" mean?");if(o.length<12&&w[0].indexOf(" ")<0)o.push("Please explain "+x+" again.")});
    u.sh=o;
  }

// ================ STATE ================
// S is the one object that holds ALL saved progress (written to localStorage by save()).
//   xp / streak / last / goal   - points, day streak, last active day, XP today
//   hearts / ets                - energy left and the time it last changed
//   p{unitId:lessons done}      - lesson progress per unit      op{unitId:1} - units unlocked with "Jump here"
//   fl{section:[fieldIds]}      - fields chosen with "Choose your field"
//   vocab{word:{m,x,f,t}}       - words marked learned (meaning, example, topic, time)
//   tw{d,k[],r}                 - Today tab: date, words learned today, refresh counter
//   cs / lu / mic               - current section, last unit, mic mode ("real" or "demo")
var S={xp:0,streak:0,last:"",spoken:0,done:0,hearts:100,goal:0,p:{},op:{},fl:{}};
// Load saved progress (merged over the defaults). Ignore errors, e.g. private mode.
try{var o=localStorage.getItem("su2");if(o)S=Object.assign(S,JSON.parse(o))}catch(e){}
// One-time upgrades (run once per saved profile): default mic mode, and reset energy.
if(S.mv!==2){S.mic="real";S.mv=2}
if(S.en2!==1){S.en2=1;S.hearts=100;S.ets=Date.now()}
if(S.en3!==1){S.en3=1;S.hearts=100;S.ets=Date.now()}
// save(): writes S to localStorage. Wrapped in try/catch because storage can be blocked.
function save(){try{localStorage.setItem("su2",JSON.stringify(S))}catch(e){}}
// gain(n): adds n XP, updates the daily streak and resets today's goal when a new day starts, then saves.
function gain(n){
  // New day? Streak +1 if the last active day was yesterday, otherwise restart at 1.
  var t=new Date().toDateString();

// LESSON ENGINE
// A lesson = L.steps (array of step objects). build(unit, lessonNumber) creates the steps; ls() draws the current step;
// pick() / tile() / ck() check answers; nx() goes to the next step.
// Step types (t): fill, listen, type, say, chat, vcx, mcq, hear, dict, learn, story, pod, pat, mp, cor, splash ...
/* ---- characters, chat ---- */
// M = the 5 characters (emoji, name) that "talk" in the lessons.
var M=[["🧕","Zari"],["🐻","Falstaff"],["👳","Sam"],["👩‍🦰","Lily"],["🧔","Junior"]];
// wd(text): words of a sentence without . , ? !
function wd(s){return s.replace(/[.,?!]/g,"").split(/\s+/)}
// dw(text): HTML where every word is a <span class="dw"> (so words can be coloured when speaking).
function dw(s){return s.split(/\s+/).filter(Boolean).map(function(w){return '<span class="dw">'+esc(w)+'</span>'}).join(" ")}
// pool(unit): all words of all sentences of the unit (used to make wrong options).
function pool(d){var a=[];d.s.forEach(function(x){a=a.concat(wd(x))});return a}
// pickW(sentence): the longest word - this is the word that gets hidden in fill-in exercises.
function pickW(s){var w=wd(s).filter(function(x){return /^[A-Za-z]+$/.test(x)}),k=0;w.forEach(function(x,i){if(x.length>w[k].length)k=i});return w[k]}
// fill(unit, sentence): "fill the blank" step. 3 options: the hidden word + 2 words from the same unit.
function fill(d,s){
  var c=pickW(s),o=[c],p=pool(d).filter(function(x){return x.length>2&&x.toLowerCase()!==c.toLowerCase()}).sort(rnd);
  for(var i=0;o.length<3&&i<p.length;i++)if(o.indexOf(p[i])<0)o.push(p[i]);
  o.sort(rnd);return{t:"fill",s:s,c:c,o:o,a:o.indexOf(c)};
}
// shortS(unit, sentence): a sentence of 6 words or fewer for listening (long ones are replaced by a short one from the unit).
function shortS(d,s){
  if(wd(s).length<=6)return s;
  var c=d.sh&&d.sh.length?d.sh:[6,8].map(function(m){return d.s.filter(function(x){return wd(x).length<=m})}).filter(function(a){return a.length})[0];
  if(!c)return s;
  return c[hash(s)%c.length];
}
// lis(unit, sentence): "tap the words you hear" step (word bank = the words + 2 extra words).
function lis(d,s){
  s=shortS(d,s);
  var w=wd(s),p=pool(d).filter(function(x){return w.indexOf(x)<0}).sort(rnd).slice(0,2);
  return{t:"listen",s:s,bank:w.concat(p).sort(rnd)};
}
// typ(sentence): "type what you hear" step. The hidden word is the longest word.
function typ(s){return{t:"type",s:s,c:pickW(s)}}
// VOC = cached list of every word in the course (used to find look-alike words for the type exercise).
var VOC=null;
// lev(a,b): Levenshtein distance = how many letters must change to turn word a into word b.
function lev(a,b){
  var m=a.length,n=b.length,p=[],i,j;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){var q=[i];for(j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}
  return p[n];
}

// similar(word): up to 6 real course words that look like the target (used as tricky wrong options).
function similar(c){

  else if(s.t==="pairs"||s.t==="mp"){c=true;exp=""}else if(s.t==="hw"){var p3=(L.ms||[]).map(function(i){return s.ch[i]});c=p3.length===3&&p3.every(function(w){return s.ans.indexOf(w)>-1});exp=s.ans.join(", ")}else if(s.t==="type"||s.t==="dict"){var ty=document.getElementById("ty");if(s.t==="dict"){c=sim(ty.value,s.s)>=.85;exp=s.s}else{c=ty.value.trim().toLowerCase()===s.c.toLowerCase();exp=s.c}ty.readOnly=true}
  else{

  }

}
/* ---- speaking: align what was said with the target sentence ---- */
/* returns per target word: "hit" (said correctly), "wrong" (said something else), "miss" (not said) */
// stat(target, said): aligns the spoken words with the target sentence (edit-distance table) and returns "hit" / "wrong" / "miss" per target word.
function stat(tg,said){
  var tw=tg.split(/\s+/).filter(Boolean).map(function(w){return norm(w).join("")}),sw=norm(said),n=tw.length,m=sw.length,d=[],i,j;
  for(i=n;i>=0;i--){d[i]=[];for(j=m;j>=0;j--)d[i][j]=i===n?m-j:j===m?n-i:0}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)d[i][j]=Math.min(d[i+1][j+1]+(tw[i]===sw[j]?0:1),d[i+1][j]+1,d[i][j+1]+1);
  var st=[];i=0;j=0;
  while(i<n){
    if(j<m&&d[i][j]===d[i+1][j+1]+(tw[i]===sw[j]?0:1)){st[i]=tw[i]===sw[j]?"hit":"wrong";i++;j++}
    else if(d[i][j]===d[i+1][j]+1){st[i]="miss";i++}
    else j++;
  }
  return st;
}
// hlEls(): the word elements that get coloured (lesson speech bubble or Speak card).
function hlEls(){return document.querySelectorAll(inL?"#ls .bub.c .dw":"#tgt .dw")}
// resetHL(): removes the colours from the words.
function resetHL(){hlEls().forEach(function(e){e.className="dw"})}
// paint(statuses): colours each word green (hit), red (wrong) or grey (miss).
function paint(st){hlEls().forEach(function(e,i){e.className="dw "+(st[i]||"miss")})}
/* while the person is still speaking: colour the words heard so far, the last one stays plain until it is final */
// live(target, said): while the learner is still speaking, colours the words heard so far.
function live(tg,said){
  var st=stat(tg,said),last=-1;
  st.forEach(function(x,i){if(x!=="miss")last=i});
  if(last>-1&&st[last]==="wrong")st[last]="miss";
  paint(st);
}
// talk(on): animates the character avatar while the mic is listening.
function talk(on){var a=document.querySelector(".av.big");if(a)a.classList.toggle("talk",!!on)}
// showRes(target, said): final score % = right words / all words, shows what was heard. Returns the score.
function showRes(tg,said){
  var st=stat(tg,said),hit=st.filter(function(x){return x==="hit"}).length,sc=Math.round(hit/st.length*100);
  paint(st);
  var m=document.getElementById("mic");if(m){m.classList.remove("on");m.classList.toggle("dn",sc>=60)}
  document.getElementById("res").innerHTML='<div class="big" style="font-size:30px">'+sc+'%</div><div class="note">You said: "'+esc(said)+'"</div>';
  document.getElementById("st").textContent="Tap the mic to try again";
  return sc;
}
// after(score): after speaking. 60% or more = good (+5 XP in Speak tab, counts as correct in a lesson). Shows Nice / Amazing / Almost there.
function after(sc){
  var s=inL&&L.steps[L.i],g=sc>=60;
  if(g){S.spoken++;if(!inL)gain(5);save()}
  if(!inL)return;
  if(!s.dn){
    s.dn=1;if(g){L.ok++;L.combo++}else L.combo=0;

  }

  f.innerHTML='<div class="fs"><div class="ft">'+(sc>=90?"Amazing!":g?"Nice!":"Almost there")+'</div>'+(g?'':'<div>Tap the mic to try again, or continue.</div>')+'<button data-a="cont">Continue</button></div>';
}
// micErr(error): turns a speech-recognition error into a clear message (permission denied, no mic, no internet ...).
function micErr(e){
  var n=(e&&(e.name||e.error))||"error",x="";
  if(window.top!==window)return "This page is inside a preview frame. Open the .html file directly in Chrome."+x;
  if(n==="NotAllowedError"||n==="not-allowed"||n==="service-not-allowed")return "Mic denied. Tap the lock icon in the address bar, set Microphone to Allow, then reload."+(location.protocol==="file:"?" If it still fails, run: python -m http.server 8000 in this folder and open http://localhost:8000":"")+x;
  if(n==="NotFoundError"||n==="audio-capture")return "No microphone found."+x;
  if(n==="no-speech")return "I did not hear anything. Try again.";
  if(n==="network")return "Chrome speech service needs internet. Check your connection."+x;
  return "Mic problem ("+n+")."+x;
}
// hits(target, said): how many target words appear in the spoken text (simple count).
function hits(tg,said){var sw=norm(said);return tg.split(/\s+/).filter(function(w){return sw.indexOf(norm(w)[0])>-1}).length}
// mic(target): the mic button. Demo mode = fake result; real mode = browser speech recognition (webkitSpeechRecognition), live colouring while speaking, then showRes + after.
function mic(tg){
  if(!rec)resetHL();
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,st=document.getElementById("st"),m=document.getElementById("mic"),cb=document.getElementById("cb");
  function fail(e){st.textContent=micErr(e);m.classList.remove("on");talk(0);if(cb)cb.disabled=false;rec=null}
  m.classList.remove("dn");
  if(S.mic==="demo"){
    if(rec)return;rec=1;m.classList.add("on");talk(1);st.textContent="Demo mode: pretending to listen...";
    setTimeout(function(){
      m.classList.remove("on");talk(0);rec=null;
      var said=tg.split(/\s+/).filter(function(x,i){return i===0||Math.random()>.2}).join(" ");
      after(showRes(tg,said));
      st.textContent="";
    },1100);
    return;
  }
  if(!SR){st.textContent="This browser has no speech recognition. Use Chrome.";if(cb)cb.disabled=false;return}
  if(rec){try{rec.stop()}catch(e){}return}
  function go(){
    rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.maxAlternatives=3;
    rec.onstart=function(){m.classList.add("on");talk(1);st.textContent="Listening... speak now"};
    rec.onresult=function(e){
      var r=e.results[e.results.length-1];
      if(!r.isFinal){st.textContent='Hearing: "'+r[0].transcript+'"';live(tg,r[0].transcript);return}
      var best=r[0].transcript,bh=hits(tg,best);
      for(var i=1;i<r.length;i++){var h=hits(tg,r[i].transcript);if(h>bh){bh=h;best=r[i].transcript}}
      after(showRes(tg,best));
    };
    rec.onspeechend=function(){try{rec.stop()}catch(x){}};
    rec.onerror=fail;
    rec.onend=function(){m.classList.remove("on");talk(0);rec=null};
    try{rec.start()}catch(e){fail(e)}
  }
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    st.textContent="Asking for mic permission...";
    rec=1;
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){s.getTracks().forEach(function(t){t.stop()});rec=null;go()}).catch(fail);
  }else go();
}

// bkCard(): the Backup card HTML (export, copy, import, paste buttons).
function bkCard(){
  return '<div class="card"><b>Backup</b><p class="note">Save your progress to a file, or restore it on another phone.</p><div class="row" style="flex-wrap:wrap"><button data-a="bx">Export</button><button class="ghost" data-a="bc">Copy</button><button class="ghost" data-a="bi">Import</button></div><input type="file" id="bf" accept=".json,application/json,text/plain" style="display:none"><textarea id="bt" class="dict" rows="3" style="margin-top:12px;min-height:80px;font-size:14px" placeholder="Or paste backup text here, then tap Restore" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><button class="ghost" data-a="br" style="margin-top:10px;width:100%">Restore from text</button><div class="note" id="bm" style="margin-top:8px"></div></div>';
}
// bk(): the backup text = JSON {app, v, t (time), s (state)}.
function bk(){return JSON.stringify({app:"speakup",v:1,t:Date.now(),s:S})}
// bmsg(text): shows a message under the backup buttons.
function bmsg(t){var e=document.getElementById("bm");if(e)e.textContent=t}
// restore(text): checks the backup JSON, replaces S with it, saves and redraws.
function restore(txt){
  try{
    var o=JSON.parse(txt),d=o&&o.app==="speakup"?o.s:o;
    if(!d||typeof d!=="object"||typeof d.xp!=="number")throw 0;
    S=Object.assign({xp:0,streak:0,last:"",spoken:0,done:0,hearts:100,goal:0,p:{},op:{},fl:{}},d);
    S.p=S.p||{};S.op=S.op||{};S.fl=S.fl||{};S.mic=S.mic||"real";S.mv=2;S.en2=1;S.en3=1;S.ets=S.ets||Date.now();
    if(!(S.pv>=4))S.pv=4;
    save();seen=0;render();bmsg("Backup restored ✓");
  }catch(e){bmsg("This backup is not valid.")}
}
// bkExport(): downloads the backup as speakup-backup-DATE.json (falls back to showing the text).
function bkExport(){
  var t=bk(),ta=document.getElementById("bt");
  try{
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));
    a.download="speakup-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    bmsg("Backup file created. If nothing downloaded, copy the text below.");
  }catch(e){bmsg("Download not possible here. Copy the text below.")}
  if(ta)ta.value=t;
}
// bkCopy(): copies the backup text to the clipboard.
function bkCopy(){
  var t=bk(),ta=document.getElementById("bt");
  function fb(){if(ta){ta.value=t;ta.focus();ta.select();bmsg("Copy the selected text and keep it safe.")}}
  try{navigator.clipboard.writeText(t).then(function(){bmsg("Backup copied ✓")}).catch(fb)}catch(e){fb()}
}
document.addEventListener("change",function(e){
  if(e.target.id!=="bf"||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){restore(String(r.result))};r.onerror=function(){bmsg("Could not read that file.")};
  r.readAsText(e.target.files[0]);e.target.value="";
});
// pScroll(): scrolls the Speak sentence card to the middle of the screen.
function pScroll(){setTimeout(function(){var e=document.querySelector(".sayw");if(e)e.scrollIntoView({block:"center",behavior:"smooth"})},30)}
// curS(): the sentence being practised now (lesson step, or Speak sentence). The first branch is LEGACY from the old Today speaking cards.
function curS(){return inL?L.steps[L.i].s:tab==="words"?twSents()[ti-twToday().length]:(function(){var d=curU();return d.s[pi%d.s.length]})()}
// ===== MAIN CLICK HANDLER =====
// One listener for the whole app. Buttons carry data-* attributes and this function reads them:
//   data-t tab | data-c Speak unit | data-a action name | data-o answer option | data-g lesson | data-k word tile
//   data-j jump | data-p field picker | data-q field choice | data-s section chip | data-dd / data-ps Speak drop-down
//   data-x sections screen | data-sj section jump | data-m / data-pa / data-pw podcast questions | data-mp matching pair
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-t],[data-c],[data-a],[data-o],[data-g],[data-k],[data-j],[data-p],[data-q],[data-s],[data-dd],[data-ps],[data-x],[data-sj],[data-m],[data-pa],[data-pw],[data-ty],[data-mp],[data-lv]");if(!t)return;
  // D = all data-* values of the tapped element. a = the action name (data-a).
  var D=t.dataset,a=D.a;
  // Type exercise: tapping a word tile copies it into the input and enables Check.
  if(D.ty!==undefined){
    var ti=document.getElementById("ty"),ts=L&&L.steps[L.i];
    if(ti&&ts&&ts.o&&!L.chk){ti.value=ts.o[+D.ty];var tb=document.getElementById("ck");if(tb)tb.disabled=false}
    return;
  }
  // Matching exercise: tap on a pair button.
  if(D.mp!==undefined){mpTap(D.mp.charAt(0),+D.mp.slice(1));return}
  // Menu button: open / close the drop-up list.
  if(D.t==="menu"){var mo=document.getElementById("mn").style.display==="block";renderMn(mo?0:1);return}
  // Bottom bar / menu item: switch tab, close the drop-up, scroll to top.
  if(D.t){renderMn(0);var pt0=tab;tab=D.t;seen=0;if(pt0==="learn"&&tab!=="learn")hpush("tab");render();scrollTo(0,0);return}
  // Speak: open / close the category drop-down.
  if(D.dd){pdd=pdd===D.dd?null:D.dd;render();return}
  // Speak: choose a section from the drop-down.
  if(D.ps){ps=D.ps;pc=null;pi=0;pdd=null;render();return}
  // Speak: open a unit (circle).
  if(D.c){var wasN=pc===null;pc=D.c;pi=0;pdd=null;if(wasN)hpush("topic");render();scrollTo(0,0);return}
  // LEVEL FILTER: Basic / Intermediate / Advanced button tapped -> save the level and redraw Home.
  if(D.lv){S.lv=D.lv;save();seen=1;render();scrollTo(0,0);return}
  // Home: a section chip was tapped.
  if(D.s){S.cs=D.s;save();seen=1;render();scrollTo(0,0);return}
  if(D.m!==undefined){hwSel(+D.m);return}
  if(D.pa!==undefined){pAud(+D.pa);return}
  if(D.pw!==undefined){pWord(+D.pw);return}
  // Home: open the "Choose your field" sheet.
  if(D.p){openPk(D.p);return}
  // Home: the pinned unit banner opens the Sections screen.
  if(D.x){openSx();return}
  // Sections screen: jump to the chosen section.
  if(D.sj){jumpSec(D.sj);return}
  // Field sheet: add / remove a field (its units appear on the path).
  if(D.q!==undefined){
    var k=PK,arr=S.fl[k]=S.fl[k]||[],ix=arr.indexOf(D.q);
    if(ix<0){arr.push(D.q);FOC="ub-"+k+"-"+D.q}else arr.splice(ix,1);
    save();renderPk();return;
  }
  // "Jump here": unlocks a locked unit.
  if(D.j!==undefined){S.op[D.j]=1;save();seen=0;render();return}
  // A lesson circle: open that lesson.
  if(D.g!==undefined){openL(D.g,+D.n);return}
  // An answer option button.
  if(D.o!==undefined){pick(+D.o);return}
  // A word tile.
  if(D.k!==undefined){tile(D.k);return}
  if(a==="pkx"){closePk();return}
  if(a==="sxx"){closeSx();return}
  // ACTIONS (data-a): listen = read aloud, slow = slow speed, rec = start mic, chk = check typed Speak sentence.
  if(a==="listen")say(curS());
  if(a==="slow")say(curS(),.55);
  if(a==="rec")mic(curS());
  if(a==="chk"){var iv=document.getElementById("ti").value.trim();if(iv)after(showRes(curS(),iv))}
  // mm: switch between Real and Demo mic mode (Me tab).
  if(a==="mm"){S.mic=S.mic==="demo"?"real":"demo";save();render()}
  // pn: next sentence in Speak. (The words branch is LEGACY.)
  if(a==="pn"){if(tab==="words"){ti++;render();scrollTo(0,0)}else{pi++;render();pScroll()}}
  // pp: previous sentence in Speak.
  if(a==="pp"){var n0=curU().s.length;pi=(pi%n0+n0-1)%n0;render()}
  if(a==="wl")say(L.steps[L.i].w[0]);
  // Continue buttons.
  if(a==="cont"||a==="nx")nx();
  // ck: Check button in a lesson.
  if(a==="ck")ck();
  // Podcast play / back / forward.
  if(a==="pt"||a==="pk"||a==="pf")pod(a);
  // retry: try the lesson again when energy is back.
  if(a==="retry"){regen();if(S.hearts>0)openL(L.id,L.n)}
  // x: close the lesson screen.
  if(a==="x"){closeL();hpop("L")}
  // Backup buttons: bx export file, bc copy, bi import file, br restore from pasted text.
  if(a==="bx")bkExport();
  if(a==="bc")bkCopy();
  if(a==="bi"){var bf=document.getElementById("bf");if(bf)bf.click()}
  if(a==="br"){var bt=document.getElementById("bt");if(bt&&bt.value.trim())restore(bt.value.trim());else bmsg("Paste your backup text first.")}
  // reset: clears progress (keeps vocabulary, fields, mic mode and settings).
  if(a==="reset"){S={xp:0,streak:0,last:"",spoken:0,done:0,hearts:100,goal:0,p:{},op:{},vocab:S.vocab||{},fl:S.fl||{},mic:S.mic,mv:S.mv,en2:1,ets:Date.now(),pv:3};save();render()}
});
// Keyboard: Escape closes the picker / Sections screen; Enter or Space on the field bar opens the picker.
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(PK)closePk();else closeSx()}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.p){e.preventDefault();openPk(e.target.dataset.p)}
});
// Typing in a type / dictation box: Check is enabled only when the box is not empty.
document.addEventListener("input",function(e){if(e.target.id==="ty"){var b=document.getElementById("ck");if(b)b.disabled=!e.target.value.trim()}});
// Theme button: toggles light / dark by setting data-theme on <html>.
document.getElementById("th").onclick=function(){
  var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=d?"light":"dark";
};
// Every second: refreshes the energy numbers and countdown timers on screen.
setInterval(function(){
  var t=enTxt(),a=document.getElementById("en"),b=document.getElementById("len"),c=document.getElementById("cd2"),r=document.getElementById("rt");
  if(a)a.textContent=t;if(b)b.textContent=S.hearts;
  if(c)c.textContent=mmss(RG-(Date.now()-S.ets));
  if(r)r.disabled=S.hearts<=0;
},1000);
try{
  // START-UP: restore the last open tab, Speak section, unit and sentence.
  var NV=JSON.parse(localStorage.getItem("su2nav")||"null");
  if(NV){
    if(["learn","words","menu","vocab","prac","me"].indexOf(NV.tab)>-1)tab=NV.tab;
    if(SECS.some(function(x){return x[0]===NV.ps}))ps=NV.ps;
    pc=NV.pc||null;pi=+NV.pi||0;
  }
}catch(e){}
// Rebuild the Back-button stack after a page reload.
HS=(history.state&&history.state.hs)||[];
if(tab!=="learn"&&HS.indexOf("tab")<0)hpush("tab");
if(tab==="prac"&&pc!==null&&HS.indexOf("topic")<0)hpush("topic");

// FIRST DRAW of the app (everything above only defines data and functions).
render();
// After the page and fonts load: measure the stats bar again.
window.addEventListener("load",function(){setSth();markCur()});
// Speak drop-downs (units / categories) changed.
document.addEventListener("change",function(e){var t=e.target;if(t&&t.id==="usel"){pc=t.value;pi=0;render()}if(t&&t.id==="csel"){ps=t.value;pc=null;pi=0;render()}});
// Speak tab swipe: swipe left / right on the sentence card for the next / previous sentence.
(function(){var x0=null,y0=null;document.addEventListener("touchstart",function(e){var c=tab==="prac"&&e.target.closest&&e.target.closest(".sayw");if(!c){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});document.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;if(dx<0){pi++;render()}else{var n0=curU().s.length;pi=(pi%n0+n0-1)%n0;render()}},{passive:true})})();
// DICTATION: DREC = the running speech recognition for the type exercise.
var DREC=null;
// dictMsg(text): shows a small message under the dictation button.
function dictMsg(t){var r=document.querySelector(".dicrow");if(!r)return;var n=r.querySelector(".dicmsg");if(!n){n=document.createElement("div");n.className="dicmsg";r.appendChild(n)}n.textContent=t||""}
// dictate(button): speak-to-type. Demo mode types a fake sentence; real mode uses browser speech recognition and fills the text box while you speak.
function dictate(btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,ty=document.getElementById("ty"),st=L&&L.steps&&L.steps[L.i];
  if(!ty||!st)return;
  function set(t){ty.value=t;ty.dispatchEvent(new Event("input",{bubbles:true}))}
  function off(){DREC=null;btn.classList.remove("on")}
  dictMsg("");
  if(DREC){try{DREC.abort()}catch(e){}off();return}
  if(S.mic==="demo"){
    DREC=1;btn.classList.add("on");
    setTimeout(function(){off();set((st.s||"").split(/\s+/).filter(function(w,i){return i===0||Math.random()>.15}).join(" "))},1100);
    return;
  }
  if(!SR){dictMsg("Speech not supported here. Use Chrome or switch to Demo mode in Me tab.");return}
  var r=new SR();DREC=r;r.lang="en-US";r.interimResults=true;r.maxAlternatives=1;
  r.onstart=function(){btn.classList.add("on")};
  r.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+" ";set(t.trim())};
  r.onerror=function(e){off();var c=e&&e.error;if(c&&c!=="no-speech"&&c!=="aborted")dictMsg(c==="not-allowed"||c==="service-not-allowed"?"Mic blocked. Allow microphone in browser, or switch to Demo mode in Me tab.":"Mic error: "+c)};
  r.onend=off;
  try{r.start()}catch(e){off();dictMsg("Could not start the mic. Try again.")}
}
// Click on the dictation microphone button.
document.addEventListener("click",function(e){var b=e.target.closest("[data-dic]");if(b)dictate(b)});
</script>
