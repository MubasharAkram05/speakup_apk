name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone + speech permissions
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' $f
          grep -n "RECORD_AUDIO\|RecognitionService" $f

      - name: Sync web files + plugins
        run: npx cap sync android

      - name: Build SIGNED release APK (fixed key)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/release.keystore \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out $GITHUB_WORKSPACE/SpeakUp-English.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify --print-certs $GITHUB_WORKSPACE/SpeakUp-English.apk | head -3

      - name: Build debug APK (no signing secrets found)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/SpeakUp-English.apk
          echo "::warning::No signing secrets set - built a DEBUG apk with a random key."

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakUp-English-apk
          path: SpeakUp-English.apk
